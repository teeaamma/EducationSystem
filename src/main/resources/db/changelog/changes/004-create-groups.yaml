databaseChangeLog:
  - changeSet:
      id: 004-create-groups
      author: timofey chervov

      changes:
        - createTable:
            tableName: groups

            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false