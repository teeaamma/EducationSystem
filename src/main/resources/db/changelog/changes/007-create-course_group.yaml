databaseChangeLog:
  - changeSet:
      id: 007-create-course_group
      author: timofey chervov

      changes:
        - createTable:
            tableName: course_group
            columns:
              - column:
                  name: course_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: course_group_pk
                    foreignKeyName: course_group_fk_course
                    references: courses(id)

              - column:
                  name: group_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: course_group_pk
                    foreignKeyName: course_group_fk_group
                    references: groups(id)